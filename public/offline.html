<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Offline - Genuine Sugar Mummies</title>
    <meta name="theme-color" content="#0f766e">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #10211f;
            background:
                radial-gradient(circle at 20% 10%, rgba(236, 72, 153, .16), transparent 28%),
                radial-gradient(circle at 80% 0%, rgba(20, 184, 166, .18), transparent 30%),
                linear-gradient(145deg, #f7f7fb, #edf7f5);
        }
        main {
            width: min(100%, 420px);
            padding: 28px;
            border: 1px solid rgba(15, 118, 110, .18);
            border-radius: 28px;
            background: rgba(255, 255, 255, .9);
            box-shadow: 0 24px 80px rgba(15, 23, 42, .14);
            text-align: center;
        }
        .mark {
            width: 76px;
            height: 76px;
            margin: 0 auto 18px;
            display: grid;
            place-items: center;
            border-radius: 24px;
            background: linear-gradient(135deg, #0f766e, #ec4899);
            color: white;
            font-size: 34px;
            font-weight: 900;
        }
        h1 { margin: 0 0 10px; font-size: 26px; line-height: 1.08; }
        p { margin: 0; color: #60716d; font-size: 14px; line-height: 1.65; }
        .status {
            margin: 18px 0;
            padding: 12px;
            border-radius: 18px;
            background: rgba(15, 118, 110, .08);
            color: #0f766e;
            font-size: 12px;
            font-weight: 800;
        }
        button, a {
            width: 100%;
            min-height: 48px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: 0;
            border-radius: 18px;
            background: linear-gradient(135deg, #0f766e, #ec4899);
            color: white;
            font-size: 14px;
            font-weight: 900;
            text-decoration: none;
            cursor: pointer;
        }
        .secondary {
            margin-top: 10px;
            background: #eef7f5;
            color: #0f766e;
        }
    </style>
</head>
<body>
    <main>
        <div class="mark">GS</div>
        <h1>You are offline</h1>
        <p>The app could not reach the network. Your installed GS app is still here; reconnect mobile data or Wi-Fi and continue.</p>
        <div class="status">No Vercel error page. This is the GS offline screen.</div>
        <button type="button" onclick="window.location.reload()">Try Again</button>
        <a class="secondary" href="/members">Open Cached App</a>
    </main>
</body>
</html>
