<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Offline - Genuine Sugarmummies</title>
    <meta name="theme-color" content="#09090b">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #fafafa;
            background: linear-gradient(180deg, #09090b, #18181b);
        }
        main {
            width: min(100%, 420px);
            padding: 28px;
            border: 1px solid rgba(255, 255, 255, .12);
            border-radius: 16px;
            background: #131316;
            box-shadow: 0 24px 80px rgba(0, 0, 0, .4);
            text-align: center;
        }
        .mark {
            width: 76px;
            height: 76px;
            margin: 0 auto 18px;
            display: grid;
            place-items: center;
            border-radius: 24px;
            background: linear-gradient(135deg, #e9034f, #9f1239);
            color: white;
            font-size: 34px;
            font-weight: 900;
        }
        h1 { margin: 0 0 10px; font-size: 26px; line-height: 1.08; }
        p { margin: 0; color: #d4d4d8; font-size: 14px; line-height: 1.65; }
        .status {
            margin: 18px 0;
            padding: 12px;
            border-radius: 12px;
            background: rgba(233, 3, 79, .13);
            color: #ff6b94;
            font-size: 12px;
            font-weight: 800;
        }
        button, a {
            width: 100%;
            min-height: 48px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: 0;
            border-radius: 12px;
            background: linear-gradient(135deg, #e9034f, #9f1239);
            color: white;
            font-size: 14px;
            font-weight: 900;
            text-decoration: none;
            cursor: pointer;
        }
        .secondary {
            margin-top: 10px;
            background: #27272a;
            color: #fafafa;
        }
    </style>
</head>
<body>
    <main>
        <div class="mark">GS</div>
        <h1>You are offline</h1>
        <p>The app could not reach the network. Reconnect mobile data or Wi-Fi and try again.</p>
        <div class="status">Saved account details remain on this device. New activity needs a connection.</div>
        <button type="button" onclick="window.location.reload()">Try Again</button>
        <a class="secondary" href="/members">Open Cached App</a>
    </main>
</body>
</html>
